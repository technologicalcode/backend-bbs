# Postgres solo para desarrollo local.
# Uso: npm run db:up  (equivale a docker compose --profile local up -d)
services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-bbs-db
    profiles: [local]
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bbs
    volumes:
      - backend-bbs-pgdata:/var/lib/postgresql/data

volumes:
  backend-bbs-pgdata:
